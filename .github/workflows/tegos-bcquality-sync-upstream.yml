name: Sync BCQuality upstream

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tegos-bcquality-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tegos-gmbh/BCQuality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main without overwriting fork changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/microsoft/BCQuality.git refs/heads/main
          if ! git merge --no-edit FETCH_HEAD; then
            echo '::error::BCQuality upstream could not be merged. Resolve the merge manually; main was not pushed.'
            exit 1
          fi
          git push origin HEAD:refs/heads/main
